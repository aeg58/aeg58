<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="Black Tool: brands pass a gate before reaching Meta, Trendyol, Hepsiburada and Entegra">
  <style>
    .t { font: 500 13px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #e8eef0; }
    .s { font: 400 11px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #86a0aa; }
    .pkt { offset-path: path("M120 150 H440"); animation: go 3.6s linear infinite; }
    .p2 { animation-delay: -1.8s; }
    @keyframes go { from { offset-distance: 0%; } to { offset-distance: 100%; } }
    @media (prefers-reduced-motion: reduce) { .pkt { animation: none; } }
  </style>
  <rect width="560" height="300" rx="10" fill="#101d24"/>
  <g stroke="#24353e" stroke-width="1"><path d="M0 75H560M0 150H560M0 225H560M140 0V300M280 0V300M420 0V300"/></g>
  <g transform="translate(24 84)">
    <rect width="96" height="34" rx="8" fill="#15232b" stroke="#2c3f49"/><text class="t" x="48" y="22" text-anchor="middle">brand A</text>
    <rect y="48" width="96" height="34" rx="8" fill="#15232b" stroke="#5cb8d6"/><text class="t" x="48" y="70" text-anchor="middle">brand B</text>
    <rect y="96" width="96" height="34" rx="8" fill="#15232b" stroke="#2c3f49"/><text class="t" x="48" y="118" text-anchor="middle">brand C</text>
  </g>
  <path d="M120 150 H440" stroke="#2c3f49" stroke-width="2" stroke-dasharray="4 5"/>
  <g transform="translate(222 108)">
    <rect width="116" height="84" rx="12" fill="#17323d" stroke="#5cb8d6" stroke-width="1.5"/>
    <text class="t" x="58" y="34" text-anchor="middle">allow-list</text>
    <text class="t" x="58" y="56" text-anchor="middle" style="fill:#a8e6a3">YAZMA OK?</text>
  </g>
  <g transform="translate(440 70)">
    <rect width="100" height="30" rx="8" fill="#15232b" stroke="#2c3f49"/><text class="t" x="50" y="20" text-anchor="middle">Meta</text>
    <rect y="44" width="100" height="30" rx="8" fill="#15232b" stroke="#2c3f49"/><text class="t" x="50" y="64" text-anchor="middle">Trendyol</text>
    <rect y="88" width="100" height="30" rx="8" fill="#15232b" stroke="#2c3f49"/><text class="t" x="50" y="108" text-anchor="middle">Hepsiburada</text>
    <rect y="132" width="100" height="30" rx="8" fill="#15232b" stroke="#2c3f49"/><text class="t" x="50" y="152" text-anchor="middle">Entegra</text>
  </g>
  <circle class="pkt" r="5" fill="#5cb8d6"/><circle class="pkt p2" r="5" fill="#5cb8d6"/>
  <text class="s" x="24" y="40">MCP gateway · 19 tools · 16 read-only</text>
  <text class="s" x="24" y="270">one brand per call · writes start PAUSED</text>
</svg>
